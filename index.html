<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA Wear</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <h1 class="logo">NOVA</h1>
      <nav>
        <a href="#">Shop</a>
        <a href="#">New In</a>
        <a href="#">Contact</a>
        <a href="#" class="cart" id="cart-open"
          >Cart (<span id="cart-count">0</span>)</a
        >
      </nav>
    </header>

    <section class="hero">
      <h2>Streetwear made in Cairo</h2>
      <p>New winter collection is here.</p>
      <a href="#products" class="btn">Shop now</a>
    </section>

    <!-- Category filters -->
    <div class="filters">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="hoodies">Hoodies</button>
      <button class="filter-btn" data-category="pants">Pants</button>
      <button class="filter-btn" data-category="tees">Tees</button>
      <button class="filter-btn" data-category="jackets">Jackets</button>
    </div>

    <!-- Empty on purpose: JavaScript builds the product cards here -->
    <section id="products" class="products"></section>

    <footer>© 2026 NOVA Wear</footer>

    <aside class="cart-panel" id="cart-panel">
      <div class="cart-header">
        <h3>Your cart</h3>
        <button id="cart-close">✕</button>
      </div>
      <ul id="cart-items"></ul>
      <p class="cart-total">Total: <span id="cart-total">0</span> EGP</p>

      <!-- NEW: checkout form -->
      <form id="checkout-form" class="checkout">
        <h4>Checkout</h4>
        <input
          type="text"
          id="customer-name"
          placeholder="Your name"
          required
        />
        <input
          type="tel"
          id="customer-phone"
          placeholder="Phone number"
          required
        />
        <textarea
          id="customer-address"
          placeholder="Delivery address"
          required
        ></textarea>
        <button type="submit" class="btn checkout-btn">
          Order on WhatsApp
        </button>
      </form>
    </aside>

    <script src="products.js"></script>
    <script src="script.js"></script>
  </body>
</html>
