<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA Wear</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <h1 class="logo">NOVA</h1>
      <nav>
        <a href="#">Shop</a>
        <a href="#">New In</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h2>Streetwear made in Cairo</h2>
      <p>New winter collection is here.</p>
      <a href="#products" class="btn">Shop now</a>
    </section>

    <section id="products" class="products">
      <div class="card">
        <img src="https://placehold.co/400x500" alt="Black hoodie" />
        <h3>Black Hoodie</h3>
        <p class="price">1,200 EGP</p>
      </div>
      <div class="card">
        <img src="https://placehold.co/400x500" alt="Cargo pants" />
        <h3>Cargo Pants</h3>
        <p class="price">950 EGP</p>
      </div>
      <div class="card">
        <img src="https://placehold.co/400x500" alt="White tee" />
        <h3>White Tee</h3>
        <p class="price">450 EGP</p>
      </div>
    </section>

    <footer>© 2026 NOVA Wear</footer>
  </body>
</html>
