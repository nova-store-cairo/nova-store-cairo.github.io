<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA Wear</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <h1 class="logo">NOVA</h1>
      <nav>
        <a href="#">Shop</a>
        <a href="#">New In</a>
        <a href="#">Contact</a>
        <a href="#" class="cart" id="cart-open"
          >Cart (<span id="cart-count">0</span>)</a
        >
      </nav>
    </header>

    <section class="hero">
      <h2>Streetwear made in Cairo</h2>
      <p>New winter collection is here.</p>
      <a href="#products" class="btn">Shop now</a>
    </section>

    <!-- Category filters -->
    <div class="filters" id="filters">
      <!-- Built by JavaScript from the categories in the database -->
    </div>

    <!-- Empty on purpose: JavaScript builds the product cards here -->
    <section id="products" class="products"></section>

    <footer>© 2026 NOVA Wear</footer>

    <!-- NEW: product details window (hidden until a card is clicked) -->
    <div class="modal" id="product-modal">
      <div class="modal-box">
        <button class="modal-close" id="modal-close">✕</button>
        <img id="modal-image" src="" alt="" />
        <div class="modal-info">
          <h2 id="modal-name"></h2>
          <p class="price" id="modal-price"></p>
          <p class="desc" id="modal-desc"></p>
          <h4>Choose your size</h4>
          <div class="sizes" id="modal-sizes"></div>
          <p class="size-error" id="size-error">Please choose a size first</p>
          <button class="add-btn" id="modal-add">Add to cart</button>
        </div>
      </div>
    </div>

    <aside class="cart-panel" id="cart-panel">
      <div class="cart-header">
        <h3>Your cart</h3>
        <button id="cart-close">✕</button>
      </div>
      <ul id="cart-items"></ul>
      <p class="cart-total">Total: <span id="cart-total">0</span> EGP</p>

      <!-- NEW: checkout form -->
      <form id="checkout-form" class="checkout">
        <h4>Checkout</h4>
        <input
          type="text"
          id="customer-name"
          placeholder="Your name"
          required
        />
        <input
          type="tel"
          id="customer-phone"
          placeholder="Phone number"
          required
        />
        <textarea
          id="customer-address"
          placeholder="Delivery address"
          required
        ></textarea>
        <button type="submit" class="btn checkout-btn">
          Order on WhatsApp
        </button>
      </form>
    </aside>

    <!-- Supabase library (lets JavaScript talk to the database) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Our connection details, then our code -->
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
